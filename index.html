<script>
// ─────────────────────────────────────────────
// DATA
//
// The data no longer lives in this file. index.html is presentation; data.json
// and people.json are what the weekly job rewrites. Two consequences worth
// knowing: a bad data run can no longer break the application, only the numbers
// in it; and the weekly diff is readable, so it can actually be reviewed.
//
// Contact details are a separate file on purpose. Everything about a community
// is public; who to call is one fetch away from being gated without touching a
// line of application code. See README.
// ─────────────────────────────────────────────

// The document now lives in Supabase (table map_data, read through the map_public
// view), so one upload in Blueprint
// can feed this map and the Vendor Assignments app from the same two workbooks
// instead of each being imported separately.
//
// The committed data.json / people.json stay in the repo and stay the fallback.
// That is not laziness about deleting them — the map has no sign-in and no error
// path a viewer can act on, so "the database is unreachable" must not mean "the
// page is blank". A stale-but-present map is strictly better than a dead one, and
// the header says which source it came from.
//
// Plain fetch against PostgREST rather than supabase-js: reads are one GET with
// two headers, and this page's only other dependency is Leaflet, vendored with an
// integrity hash. Adding a CDN library to serve one query would be a poor trade.
const MAP_DB = {
  url:  'https://memhzqphludiruovuzwt.supabase.co',

  // The anon key. It is public — every sibling app already publishes the same one
  // in its own config.js — so it is not a secret and nothing is protected by
  // hiding it. What protects the database is that `anon` has no privileges on any
  // table in it. This key can read exactly one object, the map_public view below,
  // and nothing else: not division_data, not flow_rows, not cdb_cis, not the role
  // tables. See map_supabase_setup.sql, which asserts that on every run.
  key:  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1lbWh6cXBobHVkaXJ1b3Z1end0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyMTI3MjUsImV4cCI6MjA5OTc4ODcyNX0.hTJBtb3WtkgY66xqzZ22GT7V4VNllxPyb4C7qXRFFVI',

  // A view, not the table. It projects only the columns this page renders, so the
  // rollback copies and the publisher's email address are not reachable from an
  // unauthenticated page.
  from: 'map_public',
  // Every division row this page shows, in display order. A division whose row
  // does not exist yet is simply absent — the page renders whatever it finds.
  rows: ['orlando', 'tampa'],

  // A hung request is worse than a failed one: without a deadline the map waits
  // on the network indefinitely and the fallback never runs.
  timeoutMs: 8000
};

const DATA_URL   = 'data.json';
const PEOPLE_URL = 'people.json';

// Communities are grouped onto one pin when they belong to the same
// development. Distance alone was tried first and is the wrong model: phases are
// laid out along roads, so any radius cuts somewhere arbitrary. Waterlin 50 sits
// 301 m from its nearest sibling and Wellness 50GC 599 m, so a 250 m rule
// stranded both on their own pins while grouping the rest of their development.
//
// The community names already carry the answer — "Waterlin 50" is obviously a
// Waterlin — so the development name is the primary key, and distance only fills
// in the two cases where one development is spelled two ways
// (Meadowpointe/Hidden Ridge, Prov Garden/Providence).
const MERGE_RADIUS_M = 400;

// Same-named communities still have to be plausibly near each other, so a future
// development reusing a name in another county cannot silently merge into this
// one.
const SAME_NAME_MAX_M = 25000;

// Trailing size/type designators, stripped to leave the development name:
//   Waterlin 40RL · Wellness2 40FL · Hunt Club 50GC · Reedy 50 Classic
//   Westview Villa · Edgewater MJR · Crosswinds 2 50 · Grenelefe 60M
//
// SF/PAR/CLA/VIL/MAJ matter as much as TH does, and leaving them out was a real
// bug rather than an omission: "Cypress Rsrv TH" reduced to "cypress rsrv" while
// "Cypress Rsrv SF" stayed "cypress rsrv sf", so two phases of one development
// were different developments to this rule. They then fell through to the 400 m
// distance fallback, which two phases laid out along a road routinely exceed —
// and the map drew two pins almost on top of each other.
//
// This list MUST stay identical to map-core.js's. That file decides which
// communities may vouch for each other's location and this one decides which
// share a pin, and a divergence means the two disagree about what a development
// is. A test compares them by behaviour over every real community name.
const DESIGNATOR = /^(\d+[a-z]*|th|gc|aa|rl|fl|mjr|m|villa|classic|majors|sf|par|cla|vil|maj)$/i;

function developmentOf(name) {
  const t = String(name).split(/\s+/);
  while (t.length > 1 && DESIGNATOR.test(t[t.length - 1])) t.pop();
  // Trailing digit on the base word marks a later phase: "Wellness2" is Wellness.
  return t.join(' ').replace(/\d+$/, '').trim().toLowerCase();
}

let communities = [];
let PEOPLE = {};
let ACM_CONTACTS = {};
let dataStart = null;
let meta = {};
// Divisions present in the loaded data ({key,label}); the chips and pin colours
// only appear when there is more than one.
let DIVS = [];
const DIV_COLORS = { orlando: null, tampa: '#0d9488' };   // null = the default pin blue

// Communities that arrived without usable coordinates. They are held out of
// `communities` entirely rather than plotted, because every consumer downstream
// assumes lat/lon are numbers: buildGroups() averages them, so a single null
// coerces to 0 and drags a whole development's pin into the Atlantic. Silently
// wrong beats loudly broken only if you never look at the map.
//
// This became reachable when imports moved into Blueprint. The old Node importer
// created a new community with lat/lon null and printed a reminder to run
// tools/validate.js --fix by hand before committing; a browser publish has no such
// checkpoint, so the map has to defend itself.
let unlocated = [];

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// Read the published document out of Supabase. Returns null on any failure —
// unreachable, unauthorized, empty table, malformed row — because every one of
// those has the same remedy from the page's point of view: use the files instead.
// The reason is reported so the header can distinguish "fell back" from "fine".
async function loadFromDb() {
  if (!MAP_DB.url || !MAP_DB.key) return null;

  // Reads are cheap and each payload is ~100 KB, so ask for exactly the columns
  // the page uses. One request fetches every division row at once; a division
  // whose row does not exist yet just is not in the answer.
  //
  // updated_by is deliberately not requested and not exposed by the view: it is a
  // staff email address, and this page is open to anyone.
  const keys = MAP_DB.rows.map(encodeURIComponent).join(',');
  const url = `${MAP_DB.url}/rest/v1/${MAP_DB.from}`
            + `?key=in.(${keys})`
            + `&select=key,label,payload,people,updated_at`;

  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), MAP_DB.timeoutMs);
  try {
    const r = await fetch(url, {
      signal: ctl.signal,
      cache: 'no-store',
      headers: {
        apikey: MAP_DB.key,
        Authorization: `Bearer ${MAP_DB.key}`,
        Accept: 'application/json'
      }
    });
    if (!r.ok) return { error: `${MAP_DB.from}: HTTP ${r.status}` };
    const arr = await r.json();
    const rows = (Array.isArray(arr) ? arr : [])
      .filter(x => x && x.payload)
      .sort((a, b) => MAP_DB.rows.indexOf(a.key) - MAP_DB.rows.indexOf(b.key))
      .map(x => ({ key: x.key, label: x.label || x.key, data: x.payload,
                   people: x.people || { people: {} }, publishedAt: x.updated_at || null }));
    if (!rows.length) return { error: `${MAP_DB.from}: no rows with a payload` };
    return { rows };
  } catch (err) {
    return { error: err && err.name === 'AbortError'
      ? `${MAP_DB.from}: no response within ${MAP_DB.timeoutMs} ms`
      : `${MAP_DB.from}: ${err && err.message || err}` };
  } finally {
    clearTimeout(timer);
  }
}

// The original loader, unchanged in behaviour, now used as the fallback.
async function loadFromFiles() {
  // cache: 'no-cache' revalidates on every load rather than bypassing the cache.
  // The data changes weekly, so an unchanged file comes back as a 304 with no
  // body — always current, without re-downloading ~100 KB on every page view.
  // (A query-string buster would force the full transfer each time; the old
  // file's three http-equiv cache meta tags did nothing at all, since browsers
  // ignore them on the top-level document.)
  const opts = { cache: 'no-cache' };
  const [data, ppl] = await Promise.all([
    fetch(DATA_URL, opts).then(r => {
      if (!r.ok) throw new Error(`${DATA_URL}: HTTP ${r.status}`);
      return r.json();
    }),
    fetch(PEOPLE_URL, opts).then(r => (r.ok ? r.json() : { people: {} })).catch(() => ({ people: {} }))
  ]);
  return { data, people: ppl };
}

async function loadData() {
  let source = 'database';
  let fellBackBecause = null;
  let publishedAt = null;

  let rows;
  const got = await loadFromDb();
  if (!got || got.error) {
    fellBackBecause = got && got.error ? got.error : 'database not configured';
    source = 'files';
    const f = await loadFromFiles();   // if this throws, init() reports it as fatal
    rows = [{ key: 'orlando', label: 'Orlando', data: f.data, people: f.people || { people: {} }, publishedAt: null }];
  } else {
    rows = got.rows;
    publishedAt = rows.map(r => r.publishedAt).filter(Boolean).sort().pop() || null;
  }

  // One shared month window for every division: the LATEST dataStart wins, and a
  // row published against an earlier window has its starts[] shifted into it, so
  // Tampa's numbers line up under the same month labels as Orlando's.
  dataStart = rows.map(r => r.data.dataStart).filter(Boolean).sort().pop();
  const monthsBetween = (a, b) => { const [ay, am] = a.split('-').map(Number), [by, bm] = b.split('-').map(Number);
    return (by * 12 + bm) - (ay * 12 + am); };

  meta = {
    generatedAt: rows.map(r => r.data.generatedAt).filter(Boolean).sort().pop() || null,
    updateCadenceDays: rows[0].data.updateCadenceDays || 7,
    source,
    fellBackBecause,
    publishedAt
  };

  PEOPLE = {}; ACM_CONTACTS = {};
  DIVS = rows.map(r => ({ key: r.key, label: r.label || r.key }));

  // Rehydrate each division against ITS OWN cats/vendors/people — the index
  // spaces are per document — then merge. The in-memory community shape is
  // unchanged apart from the added `division` tag, so nothing downstream had to
  // be rewritten to suit it.
  const all = [];
  for (const row of rows) {
    const data = row.data;
    const ppl = (row.people && row.people.people) || {};
    Object.assign(PEOPLE, ppl);
    const cats = data.tradeCats || [];
    const vendors = data.vendors || [];
    const shift = data.dataStart ? Math.max(0, monthsBetween(data.dataStart, dataStart)) : 0;

    (data.communities || []).forEach(c => {
      const rec = Object.assign({}, c);
      rec.division = row.key;

      if (shift > 0 && Array.isArray(rec.starts)) {
        rec.starts = rec.starts.slice(shift).concat(new Array(Math.min(shift, 12)).fill(0)).slice(0, 12);
      }

      if (c.trades) {
        const t = {};
        for (const [ci, vi] of Object.entries(c.trades)) {
          const cat = cats[ci], ven = vendors[vi];
          if (cat != null && ven != null) t[cat] = ven;
        }
        rec.trades = t;
      } else {
        rec.trades = {};
      }

      rec.cms = (c.cms || []).map(id => ppl[id]).filter(Boolean);
      if (c.acm && ppl[c.acm]) {
        const p = ppl[c.acm];
        rec.acm = p.name;
        ACM_CONTACTS[p.name] = { phone: p.phone, email: p.email };
      } else {
        rec.acm = null;
      }
      all.push(rec);
    });
  }
  communities = all;

  // Split off anything that cannot be placed. 0,0 counts as unplaceable, not as a
  // location: it is what a null becomes after arithmetic, and it is in the Gulf of
  // Guinea, so treating it as real coordinates is never right.
  const placeable = c => Number.isFinite(c.lat) && Number.isFinite(c.lon)
                      && !(c.lat === 0 && c.lon === 0);
  unlocated   = communities.filter(c => !placeable(c));
  communities = communities.filter(placeable);
}

// ─────────────────────────────────────────────
// DATE WINDOW
// ─────────────────────────────────────────────
function parseDataStart(ds) {
  const [y, m] = ds.split('-').map(Number);
  return { year: y, month: m }; // month is 1-based
}

function getMonthLabels() {
  const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const { year, month } = parseDataStart(dataStart);
  return Array.from({length:12}, (_,i) => {
    const m = (month - 1 + i) % 12;
    const y = year + Math.floor((month - 1 + i) / 12);
    return `${MONTH_NAMES[m]} '${String(y).slice(2)}`;
  });
}

// Which index in starts[] corresponds to the current calendar month
function getCurrentIdx() {
  const { year, month } = parseDataStart(dataStart);
  const now = new Date();
  const nowYM  = now.getFullYear() * 12 + (now.getMonth() + 1); // 1-based
  const startYM = year * 12 + month;
  return nowYM - startYM; // may be negative (data is future-only) or > 11 (data is all past)
}

// Indices for the next 3 months from today (clamped to [0,11])
function getNext3Idx() {
  const cur = getCurrentIdx();
  return [cur, cur+1, cur+2].filter(i => i >= 0 && i < 12);
}

let months = [];
let next3Idx = [];

function windowLabel() {
  if (months.length === 0) return '';
  return `${months[0]} – ${months[11]}`;
}

// Every next-3-month figure and every marker size derives from dataStart, so a
// wrong value here shifts the whole map without anything looking broken. It used
// to be hand-edited and had drifted out of step with its own comments. It is now
// emitted by the job that builds the data, and checked on load.
function checkDataStart() {
  const cur = getCurrentIdx();
  if (cur < 0 || cur > 1) {
    const expected = cur < 0 ? 'the future' : `${cur} months ago`;
    console.warn(
      `[data] dataStart=${dataStart} puts the current month at index ${cur} of starts[]. ` +
      `Expected 0 or 1 — the window appears to begin in ${expected}. ` +
      `Next-3-month figures and marker sizes will be wrong.`
    );
    return false;
  }
  return true;
}

// ─────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────
function fyTotal(c) { return c.starts.reduce((a,b)=>a+b,0); }
function next3Total(c) { return next3Idx.reduce((a,i)=>a+(c.starts[i]||0),0); }
function cityFromAddr(addr) { return addr.split(', ')[1] || ''; }

function hmClass(v) {
  if (v === 0) return 'hm-0';
  if (v <= 3)  return 'hm-low';
  if (v <= 7)  return 'hm-mid';
  if (v <= 14) return 'hm-high';
  return 'hm-vhigh';
}

function dotSize(n3) {
  if (n3 === 0)  return 10;
  if (n3 <= 10)  return 13;
  if (n3 <= 25)  return 17;
  return 22;
}

// ─────────────────────────────────────────────
// FRESHNESS
//
// Both dates used to be literal strings in the markup, so the header announced a
// "Next update" that would still be sitting there long after the job that was
// meant to produce it had stopped running. They are derived now, and the header
// says so when the data is overdue.
// ─────────────────────────────────────────────
function renderFreshness() {
  const el = document.getElementById('update-info');
  if (!el) return;

  if (!meta.generatedAt) {
    el.innerHTML = '<span class="stale">Update date unknown</span>';
    return;
  }

  const gen = new Date(meta.generatedAt);
  const next = new Date(gen.getTime() + meta.updateCadenceDays * 864e5);
  const ageDays = (Date.now() - gen.getTime()) / 864e5;
  const fmt = d => d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });

  // One day of slack past the cadence before complaining, so a job that runs a
  // few hours late does not raise a false alarm every week.
  const overdue = ageDays > meta.updateCadenceDays + 1;

  el.innerHTML =
    `<span>Last updated: <b>${esc(fmt(gen))}</b></span>` +
    (overdue
      ? `<span class="stale" title="Expected an update on ${esc(fmt(next))}">⚠ ${Math.floor(ageDays)} days old — update overdue</span>`
      : `<span>Next update: <b>${esc(fmt(next))}</b></span>`) +

    // Serving the committed files means a publish may have happened that this
    // page cannot see, so say so rather than showing a confidently stale date.
    (meta.source === 'files'
      ? `<span class="stale" title="${esc(meta.fellBackBecause || '')}">⚠ showing the offline copy</span>`
      : '') +

    // A community with no coordinates is absent from the map, the counts and the
    // exports. That has to be visible: the failure mode this replaces was a pin
    // silently landing at 0,0, and an invisible omission is no better.
    (unlocated.length
      ? `<span class="stale" title="${esc(unlocated.map(c => c.name).join(', '))}">`
        + `⚠ ${unlocated.length} ${unlocated.length === 1 ? 'community' : 'communities'} `
        + `awaiting a location</span>`
      : '');
}

// ─────────────────────────────────────────────
// MAP INIT
// ─────────────────────────────────────────────
let map, markers = [], groups = [], groupOf = [];
let activeItem = null;
let currentFilter = 'all';
let currentSearch = '';
let currentDivision = '';
let currentTrade = '';
let currentVendor = '';
let vendorColorMap = {};
let lastFiltered = [];

const VENDOR_COLORS = ['#1d4ed8','#0f766e','#334155','#1e3a8a','#065f46','#075985','#3f3f46','#1f2937'];

function initMap() {
  // Ensure container has explicit height (flex layout may not resolve in time)
  const el = document.getElementById('map');
  if (!el.offsetHeight) {
    el.style.height = (window.innerHeight - document.getElementById('header').offsetHeight) + 'px';
  }

  map = L.map('map', { center:[28.35,-81.55], zoom:9, zoomControl:true });

  /* The light basemap was CARTO's light_all, until CARTO started requiring an
     API key for anonymous basemap use — tiles came back stamped "API KEY
     REQUIRED". Esri's Light Gray Canvas is the same minimal style, needs no
     key, and comes from the host the satellite layer already proved works.
     Its base layer carries no labels, so the matching Reference layer rides on
     top; native tiles stop at zoom 16 and upscale beyond that. */
  const lightLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    attribution: '&copy; <a href="https://www.esri.com/">Esri</a>, HERE, Garmin, &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxNativeZoom: 16, maxZoom: 19
  });
  const lightLabelLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
    attribution: '', maxNativeZoom: 16, maxZoom: 19
  });
  const cartoLayer = L.layerGroup([lightLayer, lightLabelLayer]);   // keeps the switcher code below unchanged
  const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: '&copy; <a href="https://www.esri.com/">Esri</a>, Maxar, Earthstar Geographics',
    maxZoom: 19
  });
  const labelLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
    attribution: '', maxZoom: 19
  });

  const SAT_THUMB = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/10/427/279';
  const MAP_THUMB = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/10/427/279';

  cartoLayer.addTo(map);
  let satelliteActive = false;

  const switcher = document.createElement('div');
  switcher.id = 'basemap-switcher';
  switcher.innerHTML = `<div id="basemap-switcher-thumb" style="background-image:url('${SAT_THUMB}')"></div><span id="basemap-switcher-label">Satellite</span>`;
  el.appendChild(switcher);

  switcher.addEventListener('click', function() {
    satelliteActive = !satelliteActive;
    if (satelliteActive) {
      map.removeLayer(cartoLayer);
      satelliteLayer.addTo(map);
      labelLayer.addTo(map);
      document.getElementById('basemap-switcher-thumb').style.backgroundImage = `url('${MAP_THUMB}')`;
      document.getElementById('basemap-switcher-label').textContent = 'Map';
    } else {
      map.removeLayer(satelliteLayer);
      map.removeLayer(labelLayer);
      cartoLayer.addTo(map);
      document.getElementById('basemap-switcher-thumb').style.backgroundImage = `url('${SAT_THUMB}')`;
      document.getElementById('basemap-switcher-label').textContent = 'Satellite';
    }
  });

  setTimeout(() => map.invalidateSize(), 200);
}

// ─────────────────────────────────────────────
// PIN GROUPING
// ─────────────────────────────────────────────
function metresBetween(a, b) {
  const R = 6371000, rad = x => x * Math.PI / 180;
  const p1 = rad(a.lat), p2 = rad(b.lat);
  const dp = rad(b.lat - a.lat), dl = rad(b.lon - a.lon);
  const h = Math.sin(dp/2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

// Two communities belong on the same pin if they are the same development, or
// simply close enough that separate pins would overlap.
function sameGroup(a, b) {
  // A pin never spans divisions: pin colour is per division, and two same-named
  // developments in different divisions are different developments.
  if (a.division !== b.division) return false;
  const d = metresBetween(a, b);
  /* An empty development name is not a match. developmentOf() strips trailing
     designators and phase digits, so a community the sheets know only by its
     number — "40521", "612 2" — reduces to "", and two of those would compare
     equal and merge on the 25 km same-development radius despite having nothing
     to do with each other. map-core's sibling search carries the same `&&
     devName` guard for exactly this reason; this is the map-side half of it. */
  const dev = developmentOf(a.name);
  if (dev && dev === developmentOf(b.name)) return d <= SAME_NAME_MAX_M;
  return d <= MERGE_RADIUS_M;
}

// Single-link clustering: a community joins a group if it relates to any member,
// not just the first, so a development chains together whatever order it is
// scanned in.
function buildGroups() {
  groups = [];
  groupOf = new Array(communities.length);
  const taken = new Array(communities.length).fill(false);

  for (let i = 0; i < communities.length; i++) {
    if (taken[i]) continue;
    const members = [i];
    taken[i] = true;
    let grew = true;
    while (grew) {
      grew = false;
      for (let j = 0; j < communities.length; j++) {
        if (taken[j]) continue;
        if (members.some(k => sameGroup(communities[k], communities[j]))) {
          members.push(j); taken[j] = true; grew = true;
        }
      }
    }
    members.sort((a, b) => communities[a].name.localeCompare(communities[b].name));
    const lat = members.reduce((a, k) => a + communities[k].lat, 0) / members.length;
    const lon = members.reduce((a, k) => a + communities[k].lon, 0) / members.length;
    const g = groups.length;
    members.forEach(k => { groupOf[k] = g; });
    groups.push({ lat, lon, members, visible: new Set(members) });
  }
}

// ─────────────────────────────────────────────
// MARKERS
// ─────────────────────────────────────────────
function makeDotIcon(n3, highlighted=false, color=null, count=1) {
  const sz  = highlighted ? Math.round(dotSize(n3) * 1.25) : dotSize(n3);
  const half = sz / 2;
  const colorStyle = color ? `background:${color};border-color:rgba(255,255,255,0.8);` : '';
  // A merged pin carries a small count so it is obvious the dot stands for more
  // than one community before you click it.
  const badge = count > 1 ? `<span class="pin-count">${count}</span>` : '';
  return L.divIcon({
    className: '',
    html: `<div class="pin-dot${highlighted?' highlighted':''}" style="width:${sz}px;height:${sz}px;${colorStyle}">${badge}</div>`,
    iconSize:   [sz, sz],
    iconAnchor: [half, half],
    popupAnchor:[0, -half - 2]
  });
}

function visibleMembers(g) {
  return groups[g].members.filter(i => groups[g].visible.has(i));
}

function groupNext3(g) {
  return visibleMembers(g).reduce((a, i) => a + next3Total(communities[i]), 0);
}

// With no trade filter active, pins are coloured by division (Orlando keeps the
// default blue; other divisions get their own colour). A group never mixes
// divisions — sameGroup() guarantees that — so any member answers for the pin.
function divisionColor(g) {
  if (DIVS.length < 2) return null;
  const m = groups[g].members[0];
  const c = communities[m];
  return (c && DIV_COLORS[c.division]) || null;
}

function getMarkerColor(idx) {
  if (!currentTrade || currentVendor) return null;
  const c = communities[idx];
  const vendor = c.trades && c.trades[currentTrade];
  return vendor ? (vendorColorMap[vendor] || '#94a3b8') : '#cbd5e1';
}

// A merged pin can cover communities using different vendors for the selected
// trade. Colour by the one accounting for the most starts, so the dot reflects
// where the volume actually is.
function groupColor(g) {
  const vis = visibleMembers(g);
  if (!vis.length || !currentTrade || currentVendor) return divisionColor(g);
  let best = null, bestStarts = -1;
  for (const i of vis) {
    const s = fyTotal(communities[i]);
    if (s > bestStarts) { bestStarts = s; best = i; }
  }
  return best == null ? null : getMarkerColor(best);
}

function refreshGroupIcon(g, highlighted) {
  markers[g].setIcon(makeDotIcon(
    groupNext3(g),
    // visible, not members: a pin must not stay enlarged for a community the
    // current filter has hidden.
    highlighted === undefined ? groups[g].visible.has(activeItem) : highlighted,
    groupColor(g),
    visibleMembers(g).length
  ));
}

function buildMarkers() {
  markers = groups.map((grp, g) => {
    const marker = L.marker([grp.lat, grp.lon], {
      icon: makeDotIcon(groupNext3(g), false, null, grp.members.length)
    }).addTo(map);

    marker.bindPopup(() => buildGroupPopup(g), { maxWidth: 400, minWidth: 300 });

    marker.on('click', () => {
      // Leaflet registers its own click handler inside bindPopup, before this
      // one, so by the time we run it has already opened or closed the popup.
      // Follow that rather than fight it: clicking an open pin closes it, and
      // the close handler has already cleared the selection.
      if (!marker.isPopupOpen()) return;
      const vis = visibleMembers(g);
      if (!vis.length) return;
      // Match whatever the popup actually rendered. It restores the last tab
      // chosen for this pin, so forcing the selection to the first member here
      // would leave the popup showing one community while the info panel, the
      // sidebar highlight and the shareable URL named another.
      const sel = vis.includes(popupSelection[g]) ? popupSelection[g] : vis[0];
      // No pan: clicking a pin should not yank the map off the overview. Only
      // choosing from the sidebar recentres, which is what the original did.
      highlightItem(sel, { openPopup: false, pan: false });
    });
    marker.on('popupclose', () => {
      if (groups[g].members.includes(activeItem)) {
        const el = document.querySelector(`.community-item[data-idx="${activeItem}"]`);
        if (el) el.classList.remove('active');
        activeItem = null;
        setHash(null);
      }
      refreshGroupIcon(g, false);
      hideInfoPanel();
    });
    return marker;
  });
}

// ─────────────────────────────────────────────
// POPUPS
// ─────────────────────────────────────────────
// Every interpolation below goes through esc(), including the three that are
// arithmetic results. That looks redundant — a sum of numbers cannot carry a
// "<" — but it is only true while starts[] really does hold numbers, and this
// document arrives from a database row that nothing in the browser validates.
// A string element makes fyTotal() concatenate and Math.max() return NaN, and
// the concatenated one lands in the popup as markup. Escaping uniformly costs
// nothing and removes the need to remember which values were proven safe.
function buildPopupHTML(c) {
  const total = fyTotal(c);
  const n3    = next3Total(c);
  const activeMonths = c.starts.filter(v=>v>0).length;
  const peak  = Math.max(...c.starts);

  const cells = months.map((m,i) => {
    const v = c.starts[i];
    const isFuture = next3Idx.includes(i);
    return `<div class="hm-cell ${hmClass(v)}${isFuture?' future-highlight':''}">
      <span class="hm-month">${esc(m)}</span>
      <span class="hm-val">${esc(v)}</span>
    </div>`;
  }).join('');

  const n3Label = next3Idx.length > 0
    ? `<div class="popup-next3">Next 3 mo: ${esc(n3)} starts</div>`
    : '';

  const approxNote = c.approxGeo
    ? `<div class="approx-note" title="This pin is placed from an approximate address">◎ Approximate location</div>`
    : '';

  return `<div class="popup-inner">
    <div class="popup-header">
      <div class="popup-name">${esc(c.name)}</div>
      <div class="popup-addr">${esc(c.addr)}</div>
      ${approxNote}
      <a class="gmaps-link" href="https://www.google.com/maps/dir/?api=1&destination=${esc(c.lat)},${esc(c.lon)}" target="_blank" rel="noopener">📍 Get Directions</a>
      <div class="popup-totals">
        ${c.unforecasted
          ? `<div class="popup-total" style="color:#92400e;background:#fef3c7;padding:4px 10px;border-radius:8px;font-size:12px;">⚠ Starts not forecasted yet — schedule pending</div>`
          : `<div class="popup-total">12-mo Total: ${esc(total)} starts</div>${n3Label}`
        }
      </div>
    </div>
    <div class="popup-body">
      <div class="popup-section-label">Monthly Starts — ${esc(windowLabel())}${next3Idx.length?'  (outlined = next 3 mo)':''}</div>
      <div class="heatmap-grid">${cells}</div>
      <div class="popup-meta">
        <div class="popup-meta-item"><span>Community #</span>${esc(c.num)}</div>
        <div class="popup-meta-item"><span>Active Months</span>${activeMonths} / 12</div>
        <div class="popup-meta-item"><span>Peak Month</span>${esc(peak)} starts</div>
      </div>
      <div class="popup-staff">
        <!-- Community managers first: they are the contact a trade partner
             actually needs. The area manager stays listed below as the
             escalation point. -->
        <div class="staff-section-label">Community Manager${c.cms && c.cms.length > 1 ? 's' : ''}</div>
        ${c.cms && c.cms.length > 0 ? `<div class="staff-cm-list">${c.cms.map(cm => `
          <div class="staff-cm-row">
            <span class="staff-cm-name">${esc(cm.name)}</span>
            <div class="staff-cm-contact">
              ${cm.phone ? `<a href="tel:${esc(cm.phone)}">${esc(cm.phone)}</a>` : ''}
              ${cm.email ? `<a href="mailto:${esc(cm.email)}">Email</a>` : ''}
            </div>
          </div>`).join('')}</div>` : `<div class="staff-cm-row"><span class="staff-cm-name" style="color:#94a3b8">${c.acm ? 'Not listed — contact the area manager' : 'Not yet assigned'}</span></div>`}
        ${c.acm ? (() => { const ai = ACM_CONTACTS[c.acm] || {}; return `<div class="staff-acm-row" style="margin:8px 0 0"><span class="staff-acm-badge">ACM</span><span class="staff-acm-name">${esc(c.acm)}</span><div class="staff-acm-contact">${ai.phone ? `<a href="tel:${esc(ai.phone)}">${esc(ai.phone)}</a>` : ""}${ai.email ? `<a href="mailto:${esc(ai.email)}">Email</a>` : ""}</div></div>`; })() : ""}
      </div>
      ${c.trades && Object.keys(c.trades).length > 0 ? `
      <div class="popup-trades">
        <div class="trades-toggle" onclick="this.querySelector('.trades-arrow').classList.toggle('open'); const b=this.nextElementSibling; b.style.display=b.style.display==='none'?'block':'none';">
          <div class="staff-section-label" style="margin:0">Trade Partners</div>
          <span class="trades-arrow">▼</span>
        </div>
        <div class="trades-body" style="display:none">
          ${Object.keys(c.trades).sort().map(t=>`
          <div class="trade-row">
            <span class="trade-label">${esc(t)}</span>
            <span class="trade-vendor">${esc(c.trades[t])}</span>
          </div>`).join('')}
        </div>
      </div>` : ''}
    </div>
  </div>`;
}

// A merged pin opens one popup with a tab per community rather than stacking
// several popups on the same point. Past this many, tabs become a dropdown.
const TAB_LIMIT = 6;
let popupSelection = {}; // group -> community idx

function buildGroupPopup(g) {
  const vis = visibleMembers(g);
  const wrap = document.createElement('div');

  if (vis.length === 0) { wrap.innerHTML = '<div class="popup-inner"></div>'; return wrap; }
  if (vis.length === 1) { wrap.innerHTML = buildPopupHTML(communities[vis[0]]); return wrap; }

  let sel = popupSelection[g];
  if (sel == null || !vis.includes(sel)) sel = vis[0];

  const body = document.createElement('div');
  body.innerHTML = buildPopupHTML(communities[sel]);

  const choose = idx => {
    popupSelection[g] = idx;
    body.innerHTML = buildPopupHTML(communities[idx]);
    highlightItem(idx, { openPopup: false, pan: false });
  };

  const tabs = document.createElement('div');
  tabs.className = 'popup-tabs';

  // Tabs stop working as tabs past about half a dozen: Wellness has thirteen
  // phases, which wrapped to five rows and pushed the community itself off the
  // screen. Above the threshold this becomes a dropdown, which is one line
  // regardless of count and gets a native picker on a phone.
  if (vis.length > TAB_LIMIT) {
    tabs.innerHTML =
      `<div class="popup-tabs-label">${vis.length} communities at this location</div>` +
      `<select class="popup-tab-select">` +
      vis.map(i => `<option value="${i}"${i === sel ? ' selected' : ''}>${esc(communities[i].name)}</option>`).join('') +
      `</select>`;
    tabs.addEventListener('change', e => {
      if (e.target.classList.contains('popup-tab-select')) choose(Number(e.target.value));
    });
  } else {
    tabs.innerHTML =
      `<div class="popup-tabs-label">${vis.length} communities at this location</div>` +
      `<div class="popup-tabs-row">` +
      vis.map(i => `<button class="popup-tab${i === sel ? ' active' : ''}" data-idx="${i}">${esc(communities[i].name)}</button>`).join('') +
      `</div>`;
    tabs.addEventListener('click', e => {
      const btn = e.target.closest('.popup-tab');
      if (!btn) return;
      const idx = Number(btn.dataset.idx);
      tabs.querySelectorAll('.popup-tab').forEach(b => b.classList.toggle('active', Number(b.dataset.idx) === idx));
      choose(idx);
    });
  }

  wrap.appendChild(tabs);
  wrap.appendChild(body);
  return wrap;
}

// ─────────────────────────────────────────────
// VENDOR LEGEND
// ─────────────────────────────────────────────
function updateVendorColors() {
  const legend      = document.getElementById('vendor-legend');
  const legendItems = document.getElementById('vendor-legend-items');
  if (currentTrade && !currentVendor) {
    const vendors = [...new Set(
      communities.filter(c => c.trades && c.trades[currentTrade])
                 .map(c => c.trades[currentTrade])
    )].sort();
    vendorColorMap = {};
    vendors.forEach((v, i) => { vendorColorMap[v] = VENDOR_COLORS[i % VENDOR_COLORS.length]; });

    // Share of starts over the whole 12-month window, not the next 3.
    const vendorStarts = {};
    let grandTotal = 0;
    communities.forEach(c => {
      if (c.trades && c.trades[currentTrade]) {
        const v = c.trades[currentTrade];
        const s = (c.starts || []).reduce((a, b) => a + b, 0);
        vendorStarts[v] = (vendorStarts[v] || 0) + s;
        grandTotal += s;
      }
    });

    legendItems.innerHTML = vendors.map(v => {
      const pct = grandTotal > 0 ? Math.round((vendorStarts[v] || 0) / grandTotal * 100) : 0;
      return `<div class="legend-item"><div class="legend-dot" style="background:${vendorColorMap[v]}"></div>${esc(v)}<span class="legend-pct" title="${vendorStarts[v] || 0} of ${grandTotal} starts over next 12 months">${pct}%</span></div>`;
    }).join('');
    legend.style.display = 'block';
  } else {
    vendorColorMap = {};
    legend.style.display = 'none';
    legendItems.innerHTML = '';
  }
  groups.forEach((_, g) => { if (map.hasLayer(markers[g])) refreshGroupIcon(g); });
}

// ─────────────────────────────────────────────
// INFO PANEL
// ─────────────────────────────────────────────
function val(v) { return v && v !== 'N/A' ? v : null; }

function setInfoField(id, value) {
  const el = document.getElementById(id);
  if (value) {
    el.textContent = value;
    el.classList.remove('empty');
  } else {
    el.textContent = '—';
    el.classList.add('empty');
  }
}

function showInfoPanel(c) {
  document.getElementById('info-panel-name').textContent = c.name;
  document.getElementById('info-panel-addr').textContent =
    c.addr + (c.approxGeo ? '  (approximate)' : '');
  setInfoField('info-municipality', val(c.municipality));
  setInfoField('info-electric',     val(c.electric));
  setInfoField('info-water',        val(c.water));
  const plansRow = document.getElementById('info-plans-row');
  const plansEl  = document.getElementById('info-plans');
  if (c.plans && c.plans.length) {
    plansEl.innerHTML = c.plans.map(p => `<div style="font-size:12px;line-height:1.6">${esc(p)}</div>`).join('');
    plansRow.style.display = '';
  } else {
    plansRow.style.display = 'none';
  }
  document.getElementById('info-panel').classList.add('visible');
}

function hideInfoPanel() {
  document.getElementById('info-panel').classList.remove('visible');
}

// ─────────────────────────────────────────────
// SELECTION + DEEP LINKS
// ─────────────────────────────────────────────
function setHash(num) {
  // replaceState rather than assigning location.hash: no history entry per click,
  // and no hashchange event bouncing back into the handler.
  const url = new URL(window.location);
  url.hash = num ? `c=${num}` : '';
  history.replaceState(null, '', url.toString().replace(/#$/, ''));
}

function highlightItem(idx, opts = {}) {
  const { openPopup = true, pan = true } = opts;
  const g = groupOf[idx];

  if (activeItem !== null && activeItem !== idx) {
    const pg = groupOf[activeItem];
    const prev = document.querySelector(`.community-item[data-idx="${activeItem}"]`);
    if (prev) prev.classList.remove('active');
    if (pg !== g) refreshGroupIcon(pg, false);
  }

  activeItem = idx;
  popupSelection[g] = idx;
  refreshGroupIcon(g, true);

  const el = document.querySelector(`.community-item[data-idx="${idx}"]`);
  if (el) {
    el.classList.add('active');
    el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  if (pan) map.setView([groups[g].lat, groups[g].lon], Math.max(map.getZoom(), 13), { animate: true });
  if (openPopup) markers[g].openPopup();

  showInfoPanel(communities[idx]);
  setHash(communities[idx].num);
}

// Used by both the clear button and by a deep link that has to drop the current
// filters. Defined once so the two cannot drift apart.
function resetTradeControls() {
  currentTrade  = '';
  currentVendor = '';
  const scope  = document.getElementById('trade-scope-select');
  const vendor = document.getElementById('trade-vendor-select');
  const clear  = document.getElementById('trade-clear-btn');
  if (scope) scope.value = '';
  if (vendor) {
    vendor.innerHTML = '<option value="">— All vendors —</option>';
    vendor.value = '';
    vendor.style.display = 'none';
  }
  if (clear) clear.style.display = 'none';
}

function selectFromHash() {
  const m = /(?:^|[#&])c=([^&]+)/.exec(window.location.hash || '');
  if (!m) return false;
  const num = decodeURIComponent(m[1]);
  const idx = communities.findIndex(c => c.num === num);
  if (idx < 0) return false;

  // A linked community may be filtered out by the default view — a completed
  // community with no remaining starts is hidden. Clear the filters rather than
  // hand the recipient an empty map.
  if (!lastFiltered.some(f => f.idx === idx)) {
    currentFilter = 'all'; currentSearch = ''; currentTrade = ''; currentVendor = ''; currentDivision = '';
    document.getElementById('search').value = '';
    document.querySelectorAll('.filter-btn[data-filter]').forEach(b =>
      b.classList.toggle('active', b.dataset.filter === 'all'));
    document.querySelectorAll('.filter-btn[data-division]').forEach(b =>
      b.classList.toggle('active', b.dataset.division === ''));
    // The dropdowns have to be reset too, not just the state behind them.
    // Leaving them populated shows an active trade filter that is not applied,
    // and the vendor select becomes a dead control — its handler sets a value
    // applyFilters only consults while a trade is selected.
    resetTradeControls();
    applyFilters({ force: [idx] });
  }
  highlightItem(idx);
  return true;
}

// ─────────────────────────────────────────────
// SIDEBAR LIST
// ─────────────────────────────────────────────
function renderList(filtered) {
  const list       = document.getElementById('community-list');
  const statCount  = document.getElementById('stat-count');
  const statStarts = document.getElementById('stat-starts');

  const total = filtered.reduce((a,{c})=>a+fyTotal(c),0);
  statCount.textContent  = filtered.length;
  statStarts.textContent = total.toLocaleString();

  list.innerHTML = filtered.map(({c, idx}) => {
    const total = fyTotal(c);
    const n3    = next3Total(c);
    const city  = cityFromAddr(c.addr);
    const n3str = next3Idx.length > 0 ? `next 3 mo: ${n3}` : '';
    const grp   = groups[groupOf[idx]];
    // Count what is actually on screen. Reporting every member would claim a pin
    // is shared with communities the current filter has hidden.
    const shown = grp.visible.size || grp.members.length;
    const co    = shown > 1
      ? `<span class="item-colocated" title="Shares a map pin with ${shown - 1} other communit${shown - 1 === 1 ? 'y' : 'ies'}">◉ ${shown}</span>`
      : '';
    return `<div class="community-item" data-idx="${idx}">
      <div class="item-left">
        <div class="item-name">${esc(c.name)}${co}</div>
        <div class="item-city">${esc(city)}</div>
      </div>
      <div class="item-right">
        <div class="item-starts${c.unforecasted ? ' unforecasted' : total===0 ? ' zero' : ''}">${c.unforecasted ? 'Not forecasted' : total}</div>
        ${n3str ? `<div class="item-next3">${esc(n3str)}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('.community-item').forEach(el => {
    el.addEventListener('click', () => highlightItem(parseInt(el.dataset.idx)));
  });

  if (activeItem !== null) {
    const el = list.querySelector(`.community-item[data-idx="${activeItem}"]`);
    if (el) el.classList.add('active');
  }

  syncMobileBadge();
}

// ─────────────────────────────────────────────
// FILTERS
// ─────────────────────────────────────────────
function applyFilters(opts = {}) {
  const force = opts.force || [];
  let filtered = communities.map((c,idx)=>({c,idx}));

  // Always hide completed communities (all-zero starts, not unforecasted)
  filtered = filtered.filter(({c, idx}) => fyTotal(c) > 0 || c.unforecasted || force.includes(idx));

  if (currentFilter === 'active') {
    // "Active" means starting THIS month, which is not always index 0: a window
    // beginning one month back is a state checkDataStart deliberately tolerates,
    // and on such a file starts[0] is last month's figure. Reading it anyway is
    // silently wrong in the direction nobody checks — the list still fills, just
    // with the wrong communities. Fall back to 0 when today is outside the
    // window entirely, since there is no better answer and the old behaviour is
    // the least surprising one.
    const cur = getCurrentIdx();
    const nowIdx = cur >= 0 && cur < 12 ? cur : 0;
    filtered = filtered.filter(({c, idx}) => (c.starts[nowIdx] || 0) > 0 || force.includes(idx));
  } else if (currentFilter === 'next3') {
    filtered = filtered.filter(({c, idx}) => next3Total(c) > 0 || force.includes(idx));
  }

  if (currentDivision) {
    filtered = filtered.filter(({c, idx}) => force.includes(idx) || c.division === currentDivision);
  }

  if (currentSearch) {
    const q = currentSearch.toLowerCase();
    filtered = filtered.filter(({c, idx}) =>
      force.includes(idx) ||
      c.name.toLowerCase().includes(q) ||
      c.addr.toLowerCase().includes(q) ||
      c.num.includes(q) ||
      (c.plans && c.plans.some(p => p.toLowerCase().includes(q)))
    );
  }

  if (currentTrade) {
    filtered = filtered.filter(({c, idx}) => force.includes(idx) || (c.trades && c.trades[currentTrade]));
    if (currentVendor) {
      filtered = filtered.filter(({c, idx}) => force.includes(idx) ||
        (c.trades[currentTrade] && c.trades[currentTrade].includes(currentVendor)));
    }
  }

  // A pin shows if any of the communities under it survived the filter, and its
  // size reflects only those — so a merged pin shrinks as its members drop out
  // rather than misreporting the whole group.
  const visibleIdx = new Set(filtered.map(f => f.idx));

  // A selection the filter has just hidden would otherwise keep its info panel
  // open, its sidebar row highlighted, its pin enlarged and its number in the
  // URL — all pointing at a community no longer on the list. The pin itself
  // survives whenever a sibling in the same merged group does, so no popupclose
  // fires to tidy up; it has to be done here.
  if (activeItem !== null && !visibleIdx.has(activeItem)) {
    const stale = document.querySelector(`.community-item[data-idx="${activeItem}"]`);
    if (stale) stale.classList.remove('active');
    const g = groupOf[activeItem];
    activeItem = null;
    hideInfoPanel();
    setHash(null);
    if (markers[g] && markers[g].isPopupOpen()) markers[g].closePopup();
  }

  groups.forEach((grp, g) => {
    grp.visible = new Set(grp.members.filter(i => visibleIdx.has(i)));
    if (grp.visible.size > 0) {
      if (!map.hasLayer(markers[g])) markers[g].addTo(map);
      refreshGroupIcon(g);
    } else if (map.hasLayer(markers[g])) {
      map.removeLayer(markers[g]);
    }
  });

  filtered.sort((a, b) => a.c.name.localeCompare(b.c.name));
  lastFiltered = filtered;
  renderList(filtered);
  updateVendorColors();
}

// ─────────────────────────────────────────────
// CSV EXPORT
// ─────────────────────────────────────────────
function exportCSV() {
  const cols = ['Community','Community #','Address','City','Municipality','Electric','Water',
                'Area Manager','12-mo Starts','Next 3 mo','Latitude','Longitude','Approx. location'];
  if (DIVS.length > 1) cols.unshift('Division');
  if (currentTrade) cols.push('Trade', 'Vendor');

  // Quoting keeps the CSV well-formed; the leading apostrophe keeps Excel from
  // EXECUTING it. A cell that opens with = + - @ or a tab/return is read as a
  // formula on open, so a community named "=cmd|…" in the source spreadsheet
  // becomes a live cell in every download of this export — and the values here
  // come from workbooks other people maintain. The apostrophe is stripped on
  // display, so the text still reads correctly. Same guard as the CSV exports in
  // vendor-portal and Takeoff Flow, deliberately character-for-character.
  const cell = v => {
    let s = v == null ? '' : String(v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };

  const rows = lastFiltered.map(({c}) => {
    const r = [c.name, c.num, c.addr, cityFromAddr(c.addr), c.municipality || '', c.electric || '',
               c.water || '', c.acm || '', c.unforecasted ? 'not forecasted' : fyTotal(c),
               next3Total(c), c.lat, c.lon, c.approxGeo ? 'yes' : ''];
    if (DIVS.length > 1) r.unshift((DIVS.find(d => d.key === c.division) || {}).label || c.division || '');
    if (currentTrade) r.push(currentTrade, (c.trades && c.trades[currentTrade]) || '');
    return r.map(cell).join(',');
  });

  const stamp = new Date().toISOString().slice(0, 10);
  const blob = new Blob(['﻿' + [cols.map(cell).join(','), ...rows].join('\r\n')],
                        { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `communities-${stamp}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ─────────────────────────────────────────────
// MOBILE
// ─────────────────────────────────────────────
function syncMobileBadge() {
  const badge = document.getElementById('mobile-toggle-count');
  const stat  = document.getElementById('stat-count');
  if (badge && stat) badge.textContent = stat.textContent;
}

function toggleMobileDrawer() {
  const sidebar = document.getElementById('sidebar');
  const btn     = document.getElementById('mobile-toggle');
  const isOpen  = sidebar.classList.toggle('mobile-open');
  btn.classList.toggle('list-open', isOpen);
  btn.innerHTML = isOpen
    ? '✕ Close'
    : '☰ Communities <span class="toggle-count" id="mobile-toggle-count"></span>';
  syncMobileBadge();
}

// ─────────────────────────────────────────────
// WIRING
// ─────────────────────────────────────────────
function wireControls() {
  document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn[data-filter]').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      applyFilters();
    });
  });

  // Division chips: rendered only when the data actually spans divisions.
  const divRow = document.getElementById('division-row');
  if (divRow && DIVS.length > 1) {
    divRow.style.display = '';
    DIVS.forEach(d => {
      const b = document.createElement('button');
      b.className = 'filter-btn';
      b.dataset.division = d.key;
      const sw = DIV_COLORS[d.key] || '#2563EB';
      b.innerHTML = `<span class="div-dot" style="background:${sw}"></span>${esc(d.label)}`;
      divRow.appendChild(b);
    });
    divRow.querySelectorAll('.filter-btn[data-division]').forEach(btn => {
      btn.addEventListener('click', () => {
        divRow.querySelectorAll('.filter-btn[data-division]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentDivision = btn.dataset.division;
        applyFilters();
      });
    });
  }

  document.getElementById('search').addEventListener('input', e => {
    currentSearch = e.target.value.trim();
    applyFilters();
  });

  const exportBtn = document.getElementById('export-btn');
  if (exportBtn) exportBtn.addEventListener('click', exportCSV);

  const tradeScopeSelect  = document.getElementById('trade-scope-select');
  const tradeVendorSelect = document.getElementById('trade-vendor-select');
  const tradeClear        = document.getElementById('trade-clear-btn');

  const trades = [...new Set(communities.flatMap(c => c.trades ? Object.keys(c.trades) : []))].sort();
  trades.forEach(t => {
    const o = document.createElement('option');
    o.value = t; o.textContent = t;
    tradeScopeSelect.appendChild(o);
  });

  tradeScopeSelect.addEventListener('change', () => {
    currentTrade  = tradeScopeSelect.value;
    currentVendor = '';
    tradeVendorSelect.innerHTML = '<option value="">— All vendors —</option>';
    tradeVendorSelect.value = '';
    if (currentTrade) {
      const vendors = [...new Set(
        communities.filter(c => c.trades && c.trades[currentTrade])
                   .map(c => c.trades[currentTrade])
                   .flatMap(v => v.split(' / '))
      )].sort();
      vendors.forEach(v => {
        const o = document.createElement('option');
        o.value = v; o.textContent = v;
        tradeVendorSelect.appendChild(o);
      });
      tradeVendorSelect.style.display = 'block';
      tradeClear.style.display = 'block';
    } else {
      tradeVendorSelect.style.display = 'none';
      tradeClear.style.display = 'none';
    }
    applyFilters();
  });

  tradeVendorSelect.addEventListener('change', () => {
    currentVendor = tradeVendorSelect.value;
    applyFilters();
  });

  tradeClear.addEventListener('click', () => {
    resetTradeControls();
    applyFilters();
  });

  document.getElementById('legend').addEventListener('click', function() {
    if (window.innerWidth <= 767) this.classList.toggle('mob-expanded');
  });

  document.getElementById('community-list').addEventListener('click', () => {
    if (window.innerWidth <= 767) {
      const sidebar = document.getElementById('sidebar');
      const btn     = document.getElementById('mobile-toggle');
      sidebar.classList.remove('mobile-open');
      btn.classList.remove('list-open');
      btn.innerHTML = '☰ Communities <span class="toggle-count" id="mobile-toggle-count"></span>';
      syncMobileBadge();
    }
  });

  window.addEventListener('hashchange', selectFromHash);
}

function addOfficePin() {
  const officeIcon = L.divIcon({
    className: '',
    html: `<div class="office-pin">🏢</div>`,
    iconSize:   [18, 18],
    iconAnchor: [9, 9],
    popupAnchor:[0, -12]
  });

  L.marker([28.416139, -81.472243], { icon: officeIcon })
    .addTo(map)
    .bindPopup(`
      <div class="popup-inner">
        <div class="popup-header">
          <div class="popup-name">Lennar Orlando Division Office</div>
          <div class="popup-addr">6675 Westwood Blvd, Orlando, FL</div>
          <a class="gmaps-link" href="https://www.google.com/maps/dir/?api=1&destination=28.416139,-81.472243" target="_blank" rel="noopener">📍 Get Directions</a>
        </div>
        <div class="popup-body">
          <div style="padding:10px 0; font-size:13px; color:#334155; line-height:1.6">
            <strong>5th Floor</strong><br>
            <span style="font-size:12px;color:#64748b">Lennar Homes Orlando Division Office</span>
          </div>
        </div>
      </div>
    `, { maxWidth: 320 });
}

function fatal(msg, detail) {
  const el = document.getElementById('load-error');
  if (!el) return;
  el.querySelector('.load-error-msg').textContent = msg;
  el.querySelector('.load-error-detail').textContent = detail || '';
  el.style.display = 'flex';
}

// ─────────────────────────────────────────────
// BOOT
// ─────────────────────────────────────────────
(async function init() {
  if (typeof L === 'undefined') {
    fatal('The map library failed to load.',
          'vendor/leaflet-1.9.4/leaflet.js did not run. If the file was edited its integrity '
          + 'hash will no longer match and the browser will refuse it — re-run tools/vendor-leaflet.js.');
    return;
  }

  try {
    await loadData();
  } catch (err) {
    fatal('Could not load community data.', String(err && err.message || err));
    return;
  }

  if (!communities.length) {
    // Distinguish "no data" from "data arrived but nothing could be placed" —
    // they look identical on screen and have completely different causes.
    fatal(
      unlocated.length
        ? `Loaded ${unlocated.length} communities, but none has usable coordinates.`
        : 'Community data loaded but contained no communities.',
      unlocated.length
        ? 'Every record is missing lat/lon. Set coordinates in Blueprint (Data Intake → '
          + 'awaiting a location), or run tools/validate.js --fix against data.json.'
        : `Source was the ${meta.source === 'files' ? 'committed data.json' : 'map_data table'}.`
    );
    return;
  }

  months   = getMonthLabels();
  next3Idx = getNext3Idx();
  checkDataStart();

  renderFreshness();

  const totalFY = communities.reduce((a,c)=>a+fyTotal(c),0);
  document.getElementById('hdr-starts').textContent = totalFY.toLocaleString();
  document.getElementById('hdr-count').textContent  = communities.length;
  document.getElementById('hdr-window').textContent = windowLabel();

  // Header names whichever divisions actually loaded.
  const sub = document.getElementById('hdr-subtitle');
  if (sub && DIVS.length) {
    sub.textContent = (DIVS.length === 1
      ? `${DIVS[0].label} Division`
      : DIVS.map(d => d.label).join(' & ') + ' Divisions') + ' — Community Map';
  }

  initMap();
  buildGroups();
  buildMarkers();
  addOfficePin();
  wireControls();
  applyFilters();

  // With more than one division the hardcoded Orlando center no longer frames
  // the data — fit the view to every pin instead. Feature-checked so a partial
  // Leaflet (the test harness stubs it) degrades to the default view.
  if (DIVS.length > 1 && groups.length && typeof L.latLngBounds === 'function' && map.fitBounds) {
    map.fitBounds(L.latLngBounds(groups.map(g => [g.lat, g.lon])), { padding: [40, 40] });
  }

  selectFromHash();
})();
</script>
